# Alternative to `bun run db:dev` if you have Docker: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yoga
      POSTGRES_PASSWORD: yoga
      POSTGRES_DB: yoga
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
